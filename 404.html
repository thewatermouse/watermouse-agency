<style>
  :root{
    --sage:#4A7C6F;--sage-light:#7AAB9B;--sage-pale:#EAF2EF;
    --sage-dark:#2D5246;--warm:#E8DDD0;--warm-deep:#C4A882;
    --ink:#1C2B26;--off-white:#FAF8F5;--white:#FFFFFF;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'DM Sans',sans-serif;
    background:var(--ink);
    color:var(--off-white);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* NAV */
  nav{padding:24px 60px;display:flex;align-items:center;justify-content:space-between;}
  .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .nav-logo-word{font-family:'Fraunces',serif;font-size:22px;font-weight:300;color:rgba(250,248,245,0.6);letter-spacing:0.04em;}
  .nav-cta{background:rgba(255,255,255,0.08);color:rgba(250,248,245,0.7);padding:10px 22px;border-radius:100px;font-size:13px;font-weight:500;text-decoration:none;transition:background 0.2s;}
  .nav-cta:hover{background:rgba(255,255,255,0.14);}

  /* MAIN */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 24px;
    position:relative;
    overflow:hidden;
  }

  /* Background crosshair — large, faint */
  .bg-target{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:500px;height:500px;
    opacity:0.04;
    pointer-events:none;
  }

  .error-label{
    font-size:11px;font-weight:500;letter-spacing:0.18em;
    text-transform:uppercase;color:var(--sage-light);
    opacity:0.6;margin-bottom:24px;
    animation:fadeUp 0.5s ease both;
  }
  .error-code{
    font-family:'Fraunces',serif;
    font-size:140px;font-weight:300;line-height:1;
    color:rgba(250,248,245,0.06);
    letter-spacing:-0.02em;
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-58%);
    user-select:none;
    pointer-events:none;
  }
  .error-headline{
    font-family:'Fraunces',serif;
    font-size:52px;font-weight:300;line-height:1.1;
    color:var(--off-white);
    margin-bottom:16px;
    position:relative;z-index:1;
    animation:fadeUp 0.5s ease 0.06s both;
  }
  .error-headline em{font-style:italic;color:var(--sage-light);}
  .error-sub{
    font-size:16px;font-weight:300;line-height:1.7;
    color:rgba(250,248,245,0.4);
    max-width:420px;
    margin-bottom:48px;
    position:relative;z-index:1;
    animation:fadeUp 0.5s ease 0.12s both;
  }

  .error-links{
    display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
    position:relative;z-index:1;
    animation:fadeUp 0.5s ease 0.18s both;
  }
  .btn-primary{
    background:var(--sage);color:var(--off-white);
    padding:14px 28px;border-radius:100px;
    font-size:14px;font-weight:500;text-decoration:none;
    display:inline-flex;align-items:center;gap:8px;
    transition:background 0.2s;
  }
  .btn-primary:hover{background:var(--sage-dark);}
  .btn-ghost{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    color:rgba(250,248,245,0.6);
    padding:14px 28px;border-radius:100px;
    font-size:14px;font-weight:400;text-decoration:none;
    display:inline-flex;align-items:center;gap:8px;
    transition:background 0.2s,color 0.2s;
  }
  .btn-ghost:hover{background:rgba(255,255,255,0.1);color:rgba(250,248,245,0.9);}

  /* Quick nav */
  .quick-nav{
    margin-top:64px;
    padding-top:40px;
    border-top:1px solid rgba(255,255,255,0.06);
    display:flex;gap:32px;flex-wrap:wrap;justify-content:center;
    position:relative;z-index:1;
    animation:fadeUp 0.5s ease 0.24s both;
  }
  .quick-nav a{
    font-size:13px;font-weight:300;
    color:rgba(250,248,245,0.28);
    text-decoration:none;
    transition:color 0.2s;
  }
  .quick-nav a:hover{color:rgba(250,248,245,0.7);}

  /* Footer */
  footer{
    padding:24px 60px;
    text-align:center;
    font-size:12px;
    color:rgba(250,248,245,0.15);
    border-top:1px solid rgba(255,255,255,0.04);
  }

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  @media(max-width:600px){
    nav{padding:20px 24px;}
    .error-headline{font-size:36px;}
    .error-code{font-size:100px;}
    .error-links{flex-direction:column;align-items:center;}
    .btn-primary,.btn-ghost{width:100%;max-width:280px;justify-content:center;}
    footer{padding:20px 24px;}
  }
</style>
</head>
